name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check documentation footer bump policy
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-footer-bump.py "origin/${{ github.base_ref }}" "HEAD"

      # Unconditional, unlike the footer check above. That one needs a base to
      # diff against; this one asks a question about the file as it stands, so
      # a push to main should answer it too - the notice can be removed by a
      # direct commit just as easily as by a pull request.
      - name: Check the community-project notice is above the fold
        run: python3 scripts/check-community-notice.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Linting & Formatting Check
        run: yarn lint

      - name: Validate GraphQL Queries Against Liferay Schema
        run: yarn validate:graphql

      - name: Validate REST Paths Against Liferay OpenAPI Specs
        run: yarn validate:rest

      - name: Run Unit Tests With Coverage
        run: yarn test -- --coverage
