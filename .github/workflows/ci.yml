name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation footer bump policy
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-footer-bump.py "origin/${{ github.base_ref }}" "HEAD"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Linting & Formatting Check
        run: yarn lint

      - name: Validate GraphQL Queries Against Liferay Schema
        run: yarn validate:graphql

      - name: Run Unit Tests With Coverage
        run: yarn test -- --coverage
